kind = "web"
previewPath = "/"
title = "Student Portfolio Learning Log"
description = "A dark, readable progressive portfolio for a student developer to share school assignments, experiments, and learning notes."
version = "1.0.0"
id = "artifacts/student-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21090

[services.development]
run = "pnpm --filter @workspace/student-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/student-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/student-portfolio/dist/public"

[services.env]
PORT = "21090"
BASE_PATH = "/"
